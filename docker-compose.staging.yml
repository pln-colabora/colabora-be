services:
  app:
    image: ghcr.io/pln-colabora/colabora-be:${IMAGE_TAG:-main}
    container_name: ${APP_NAME:-colabora-be-staging}-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${GOLANG_PORT:-8889}:8888"
    depends_on:
      - postgres
    networks:
      - app-network

  nginx:
    image: nginx:1.27-alpine
    container_name: ${APP_NAME:-colabora-be-staging}-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NGINX_PORT:-8081}:80"
    volumes:
      - ./docker/nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro,Z
    depends_on:
      - app
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    container_name: ${APP_NAME:-colabora-be-staging}-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - staging-db-data:/var/lib/postgresql/data
    networks:
      - app-network

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: ${APP_NAME:-colabora-be-staging}-garage
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro,Z
      - staging-garage-meta:/var/lib/garage/meta
      - staging-garage-data:/var/lib/garage/data
    networks:
      - app-network

volumes:
  staging-db-data:
  staging-garage-meta:
  staging-garage-data:

networks:
  app-network:
    driver: bridge
