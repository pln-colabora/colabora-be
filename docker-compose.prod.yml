services:
  app:
    image: ghcr.io/pln-colabora/colabora-be:${IMAGE_TAG:-latest}
    container_name: ${APP_NAME:-colabora-be}-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${GOLANG_PORT:-8888}:8888"
    depends_on:
      - postgres
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: ${APP_NAME:-colabora-be}-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    container_name: ${APP_NAME:-colabora-be}-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  db-data:

networks:
  app-network:
    driver: bridge
