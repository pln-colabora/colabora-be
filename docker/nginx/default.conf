server {
    listen 80;
    server_name api-colabora.anargya.fun;

    # Docker's embedded DNS. Resolving "app" via a variable (instead of a
    # static proxy_pass) forces nginx to re-lookup it periodically instead of
    # caching the upstream IP for the lifetime of the nginx process — without
    # this, nginx keeps talking to the old container after every app-only
    # redeploy (nginx itself is never recreated, so it never re-resolves).
    resolver 127.0.0.11 valid=10s;

    location / {
        set $app_upstream app:8888;
        proxy_pass          http://$app_upstream;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection keep-alive;
        proxy_set_header    Host $host;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass  $http_upgrade;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
    }
}
