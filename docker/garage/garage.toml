# Single-node Garage config for evidence document storage (see PHASE5_DOCUMENTS.md).
# rpc_secret is intentionally NOT set here — it's provided via the GARAGE_RPC_SECRET env
# var (see docker-compose.yml), so no secret ever gets committed to this repo-tracked file.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "garage:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"
