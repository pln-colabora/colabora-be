openapi: 3.0.3
info:
  title: COLABORA API — Tahap 1 Permohonan PB/PD
  description: >-
    Tahap 1 — Permohonan PB/PD. Menyediakan pembuatan permohonan, dashboard,
    detail workflow, timeline aktivitas, audit log, dan penugasan vendor.
    Status teknis tetap memakai enum backend; label proses bisnis dijelaskan
    sebagai Selesai, Sedang berjalan, Perlu tindakan, Belum dimulai, atau
    Tidak berlaku.
  version: "1.0.0"
servers:
  - url: https://api-colabora.anargya.fun
    description: Production
  - url: http://localhost:8888
    description: Local (default GOLANG_PORT)
tags:
  - name: "Tahap 1 — Permohonan PB/PD"
    description: "Activity #1 dan endpoint agregat permohonan"
paths:
  /api/permohonan:
    get:
      tags: ["Tahap 1 — Permohonan PB/PD"]
      operationId: listPermohonan
      summary: Dashboard Permohonan PB/PD
      description: Daftar permohonan terpaginasikan dengan filter stage, SLA, status, ULP, dan scope tugas caller.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 10 } }
        - { name: search, in: query, description: Matches no_permohonan or pelanggan_nama, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, default: created_at } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: ulp, in: query, description: Filter by ULP unit, schema: { type: string } }
        - { name: jenis_sambungan, in: query, schema: { type: string, enum: ["JTR", "JTM/Gardu", "PLG TM <5 GWNG", "PLG TM >5 GWNG"] } }
        - { name: stage, in: query, description: Filter by Tahap 1-7, schema: { type: integer, minimum: 1, maximum: 7 } }
        - { name: status, in: query, schema: { type: string } }
        - { name: sla, in: query, description: Buckets by actionable workflow-node deadlines, schema: { type: string, enum: [ontime, duesoon, overdue] } }
        - { name: scope, in: query, description: mine returns rows with a caller-owned actionable node, schema: { type: string, enum: [mine, all], default: all } }
      responses:
        "200": { description: Daftar permohonan, content: { application/json: { schema: { $ref: "#/components/schemas/PaginatedPermohonanResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: ["Tahap 1 — Permohonan PB/PD"]
      operationId: createPermohonan
      summary: Membuat Permohonan PB/PD (Activity #1)
      description: >-
        JTR/JTM dibuat oleh ULP — Pelayanan Pelanggan dengan ULP caller. PLG TM
        dibuat oleh UP3 — NPS dengan target ULP yang valid. Node `permohonan`
        selesai dan node `survei` menjadi tersedia.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jenis_permohonan, jenis_sambungan, pelanggan_nama, pelanggan_alamat, pelanggan_no_hp]
              properties:
                jenis_permohonan: { type: string, enum: ["Pasang Baru (PB)", "Perubahan Daya (PD)"] }
                jenis_sambungan: { type: string, enum: ["JTR", "JTM/Gardu", "PLG TM <5 GWNG", "PLG TM >5 GWNG"] }
                ulp_unit: { type: string, nullable: true, description: Required only for PLG TM; forbidden for JTR/JTM }
                pelanggan_nama: { type: string, minLength: 2, maxLength: 150 }
                pelanggan_alamat: { type: string, minLength: 2, maxLength: 255 }
                pelanggan_no_hp: { type: string, minLength: 8, maxLength: 20 }
      responses:
        "201": { description: Permohonan PB/PD dibuat, content: { application/json: { schema: { $ref: "#/components/schemas/PermohonanEnvelope" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/permohonan/{id}:
    get:
      tags: ["Tahap 1 — Permohonan PB/PD"]
      operationId: getPermohonanDetail
      summary: Detail Permohonan PB/PD
      description: Mengembalikan seluruh node workflow dan `available_actions` milik caller.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PermohonanID" }]
      responses:
        "200": { description: Detail permohonan, content: { application/json: { schema: { $ref: "#/components/schemas/PermohonanEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/permohonan/{id}/activities:
    get:
      tags: ["Tahap 1 — Permohonan PB/PD"]
      operationId: getPermohonanActivities
      summary: Timeline 17 aktivitas dan percabangan workflow
      description: Node diurutkan berdasarkan tahap, activity number, dan waktu; status skipped berarti Tidak berlaku.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PermohonanID" }]
      responses:
        "200": { description: Timeline workflow, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowNodesEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/permohonan/{id}/logs:
    get:
      tags: ["Tahap 1 — Permohonan PB/PD"]
      operationId: getPermohonanLogs
      summary: Riwayat aktivitas dan audit log
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PermohonanID" }]
      responses:
        "200": { description: Audit log oldest-first, content: { application/json: { schema: { $ref: "#/components/schemas/ActivityLogsEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/permohonan/{id}/vendor-assignments:
    post:
      tags: ["Tahap 1 — Permohonan PB/PD"]
      operationId: assignVendor
      summary: Menetapkan vendor pada permohonan
      description: >-
        Assignment dilakukan setelah delegasi NPS. Satu slot role vendor bersifat
        immutable; vendor role harus sesuai dengan akun target dan cabang workflow.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PermohonanID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendor_id, vendor_role]
              properties:
                vendor_id: { type: string, format: uuid }
                vendor_role: { type: string, enum: [vendor-tiang, vendor-konstruksi, vendor-sr-app] }
      responses:
        "200": { $ref: "#/components/responses/ActivitySubmitted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    ActivitySubmitted: { description: Workflow node selesai dan agregat diperbarui, content: { application/json: { schema: { $ref: "#/components/schemas/PermohonanEnvelope" } } } }
    BadRequest: { description: Input atau business rule tidak valid, content: { application/json: { schema: { $ref: "#/components/schemas/ApiResponse" } } } }
    Unauthorized: { description: Token tidak ada atau tidak valid, content: { application/json: { schema: { $ref: "#/components/schemas/ApiResponse" } } } }
    Forbidden: { description: Caller tidak memiliki akses, content: { application/json: { schema: { $ref: "#/components/schemas/ApiResponse" } } } }
    NotFound: { description: Permohonan tidak ditemukan atau tidak terlihat oleh caller, content: { application/json: { schema: { $ref: "#/components/schemas/ApiResponse" } } } }
    Conflict: { description: Node tidak actionable, duplicate, atau prerequisite belum terpenuhi, content: { application/json: { schema: { $ref: "#/components/schemas/ApiResponse" } } } }
  parameters:
    PermohonanID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    ApiResponse:
      type: object
      properties:
        status: { type: boolean }
        message: { type: string }
        error: { nullable: true, oneOf: [{ type: string }, { type: object }] }
        data: { nullable: true }
    PermohonanEnvelope:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties: { data: { $ref: "#/components/schemas/PermohonanResponse" } }
    WorkflowNodesEnvelope:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties: { data: { type: array, items: { $ref: "#/components/schemas/WorkflowNode" } } }
    ActivityLogsEnvelope:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties: { data: { type: array, items: { $ref: "#/components/schemas/ActivityLog" } } }
    PermohonanResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        no_permohonan: { type: string }
        jenis_permohonan: { type: string }
        jenis_sambungan: { type: string }
        ulp_unit: { type: string }
        pelanggan_nama: { type: string }
        pelanggan_alamat: { type: string }
        pelanggan_no_hp: { type: string }
        request_date: { type: string, format: date }
        current_stage: { type: integer, minimum: 1, maximum: 7 }
        status: { type: string, enum: [in_progress, completed, returned] }
        sla_deadline: { type: string, format: date, nullable: true }
        sla_status: { type: string, enum: [none, on_time, due_soon, overdue] }
        kebutuhan_tiang: { type: boolean, nullable: true }
        nps_delegation_status: { type: string, nullable: true, enum: [delegated, returned] }
        perlu_pdkb: { type: boolean, nullable: true }
        created_by: { type: string, format: uuid }
        workflow_nodes: { type: array, description: "Vendor callers receive only their issued WO node; internal callers receive the full projection.", items: { $ref: "#/components/schemas/WorkflowNode" } }
        available_actions: { type: array, items: { $ref: "#/components/schemas/AvailableAction" } }
    WorkflowNode: { type: object, properties: { workflow_node: { type: string }, activity_number: { type: integer, nullable: true }, stage_number: { type: integer }, status: { type: string, enum: [locked, available, in_progress, completed, skipped] }, sla_deadline: { type: string, format: date, nullable: true }, sla_status: { type: string, enum: [none, on_time, due_soon, overdue] }, payload: { type: object, additionalProperties: true }, completed_by: { type: string, format: uuid, nullable: true }, completed_at: { type: string, format: date-time, nullable: true } } }
    AvailableAction: { type: object, properties: { workflow_node: { type: string }, activity_number: { type: integer, nullable: true }, stage_number: { type: integer }, method: { type: string }, path: { type: string } } }
    ActivityLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        workflow_node: { type: string, nullable: true }
        activity_number: { type: integer, nullable: true }
        actor: { type: string }
        action: { type: string }
        detail: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        max_page: { type: integer }
        total: { type: integer }
    PaginatedPermohonanResponse:
      type: object
      properties:
        code: { type: integer }
        status: { type: string }
        message: { type: string }
        data: { type: array, items: { $ref: "#/components/schemas/PermohonanResponse" } }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }
