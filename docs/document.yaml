openapi: 3.0.3
info:
  title: COLABORA API — Document
  description: >-
    Upload-first evidence storage: POST /api/documents uploads a raw file
    standalone and returns an id; it gets attached to a specific permohonan +
    workflow node later (DocumentService.AttachToWorkflowNode), by whichever Phase 4
    workflow endpoint references that id when its form is submitted
    — not yet exposed as its own HTTP endpoint. See `modules/document` and
    `PHASE5_DOCUMENTS.md`.
  version: "1.0.0"
servers:
  - url: https://api-colabora.anargya.fun
    description: Production
  - url: http://localhost:8888
    description: Local (default GOLANG_PORT)
tags:
  - name: Document
    description: Standalone evidence upload, plus per-permohonan list/download once attached
paths:
  /api/documents:
    post:
      tags: [Document]
      summary: Upload a raw evidence file (standalone, not yet attached to any permohonan)
      description: >-
        No RBAC/ownership check here — there's no permohonan/workflow-node context
        yet to check ownership against. Max 10MB; application/pdf,
        image/jpeg, or image/png only. The service checks the actual file bytes
        against the declared MIME type and enforces the actual byte limit.
        The full multipart request is limited to 11 MiB. Storage keys are opaque
        and exclude the original filename. Upload provenance records the original
        filename, detected MIME, measured size, SHA-256, classification and scan
        status. When CLAMAV_ADDRESS is configured, scanning is synchronous and a
        scanner error or infected verdict rejects the upload. Otherwise scan_status
        is explicitly not_scanned.
        Unattached uploads may only be attached by their uploader. Once bound,
        the file may evidence other nodes of that same request.
        Optional supersedes_document_id replaces only a same-type upload owned by
        the caller while it remains unattached. Attached evidence is immutable.
        The returned id is later attached to a
        permohonan + workflow node by an activity-submission endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, type]
              properties:
                file: { type: string, format: binary }
                type:
                  type: string
                  maxLength: 50
                  description: Business document category, e.g. "evidence"
                supersedes_document_id:
                  type: string
                  format: uuid
                  description: Optional current unattached upload to supersede
      responses:
        "201":
          description: Document uploaded, unattached
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DocumentResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Malware was detected in the uploaded bytes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
        "503":
          description: Configured malware scanner is unavailable or returned an invalid result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /api/permohonan/{id}/documents:
    get:
      tags: [Document]
      summary: List documents attached to a permohonan
      description: >-
        Only returns attached documents for requests the caller can access.
        Vendors require an explicit account/role assignment; ULP roles require
        matching ULP. UP3 operational roles and super-user have cross-ULP read
        access. Inaccessible requests return 404.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: workflow_node
          in: query
          description: Filter to one canonical workflow node's evidence
          schema: { type: string, example: survei }
      responses:
        "200":
          description: Documents for this permohonan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/DocumentResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/documents/{id}/preview:
    get:
      tags: [Document]
      summary: Create a short-lived preview URL
      description: >-
        Returns a short-lived signed URL for inline preview of a PDF or image.
        Attached documents require read access to their permohonan. Unattached
        uploads can only be previewed by their uploader. Superseded and infected
        documents are unavailable.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Preview URL created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DocumentPreviewResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Document not found or caller cannot access it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
        "409":
          description: Document is unavailable because it was infected or superseded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /api/permohonan/{id}/documents/{doc_id}:
    get:
      tags: [Document]
      summary: Download a document
      description: >-
        Redirects (302) to a short-lived (15 minute) presigned URL. 404s if
        the document doesn't exist, isn't attached to this permohonan, or
        isn't attached to any permohonan yet, or the caller cannot access the
        request. Vendors require an explicit account/role assignment.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: doc_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "302":
          description: Redirect to a presigned download URL
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Document not found (or not attached to this permohonan)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
        "409":
          description: Document is unavailable because its scan status is infected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Request failed validation or business logic
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
    Unauthorized:
      description: Missing, invalid, or expired token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
  schemas:
    ApiResponse:
      type: object
      properties:
        status: { type: boolean }
        message: { type: string }
        error:
          nullable: true
          description: Present only when status is false
          oneOf:
            - type: string
            - type: object
        data:
          nullable: true
    DocumentResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, example: "evidence" }
        original_filename: { type: string, example: "bukti.pdf" }
        mime_type: { type: string, example: "application/pdf" }
        size_bytes: { type: integer, format: int64, minimum: 1 }
        checksum_sha256: { type: string, minLength: 64, maxLength: 64 }
        source: { type: string, enum: [uploaded, generated, imported, scanned] }
        classification: { type: string, enum: [internal, restricted, public] }
        scan_status: { type: string, enum: [not_scanned, clean, infected] }
        scan_checked_at: { type: string, format: date-time, nullable: true }
        revision: { type: integer, minimum: 1 }
        supersedes_id: { type: string, format: uuid, nullable: true }
        superseded_by_id: { type: string, format: uuid, nullable: true }
        permohonan_id:
          type: string
          format: uuid
          nullable: true
          description: Null until attached
        workflow_nodes:
          type: array
          description: Canonical workflow nodes this file evidences; empty until attached
          items: { type: string }
        uploaded_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    DocumentPreviewResponse:
      type: object
      required: [url, mime_type, filename, expires_at]
      properties:
        url: { type: string, format: uri }
        mime_type: { type: string, example: "application/pdf" }
        filename: { type: string, example: "bukti.pdf" }
        expires_at: { type: string, format: date-time }
