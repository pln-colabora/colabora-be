        notes: { type: string, maxLength: 2000 }
        document_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
    ExpansionSubmitRequest:
      type: object
      required: [nps_delegation_status, document_ids]
      properties:
        nps_delegation_status: { type: string, enum: [delegated, returned] }
        notes: { type: string, maxLength: 2000 }
        document_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
    EvidenceSubmitRequest:
      type: object
      required: [document_ids]
      properties:
        notes: { type: string, maxLength: 2000 }
        document_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
    WOConstructionSubmitRequest:
      type: object
      required: [perlu_pdkb, document_ids]
      properties:
        perlu_pdkb:
          type: boolean
