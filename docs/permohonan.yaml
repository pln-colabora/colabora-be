openapi: 3.0.3
info:
  title: COLABORA API — Permohonan
  description: >-
    Workflow-node API: connection-specific request creation, dashboard list,
    detail with caller-owned actions, full activity timeline and logs, plus
    Phase 4 Sequences 1-5 submissions through terminal completion. Request
    resources enforce matching ULP access for ULP roles, explicit account
    assignment for vendors, and cross-ULP reads for UP3 operational roles and
    super-user. Inaccessible requests return 404. List scope=all does not bypass
    access filtering.
  version: "1.0.0"
servers:
  - url: https://api-colabora.anargya.fun
    description: Production
  - url: http://localhost:8888
    description: Local (default GOLANG_PORT)
tags:
  - name: Permohonan
    description: Core permohonan aggregate — create, dashboard list, detail
paths:
  /api/permohonan:
    get:
      tags: [Permohonan]
      summary: Dashboard list of permohonan (paginated, filtered)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 10 }
        - name: search
          in: query
          description: Matches against no_permohonan or pelanggan_nama
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, default: created_at }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc] }
        - name: ulp
          in: query
          description: Filter by UlpUnit
          schema: { type: string }
        - name: jenis_sambungan
          in: query
          schema:
            type: string
            enum: ["JTR", "JTM/Gardu", "PLG TM <5 GWNG", "PLG TM >5 GWNG"]
        - name: stage
          in: query
          description: Filter by CurrentStage (1-7)
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string }
        - name: sla
          in: query
          description: Buckets by actionable workflow-node deadlines
          schema: { type: string, enum: [ontime, duesoon, overdue] }
        - name: scope
          in: query
          description: mine = rows with an available/in-progress node owned by the caller
          schema: { type: string, enum: [mine, all], default: all }
      responses:
        "200":
          description: Paginated permohonan list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedPermohonanResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Permohonan]
      summary: Open a new permohonan (Activity #1)
      description: >-
        For JTR/JTM, only `pelayanan-pelanggan` may call this and `ulp_unit`
        must be omitted because it is derived from the caller. For PLG TM,
        only `nps` may call this and a configured target `ulp_unit` is required.
        Submission completes the entry node and makes `survei` available.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jenis_permohonan, jenis_sambungan, pelanggan_nama, pelanggan_alamat, pelanggan_no_hp]
              properties:
                jenis_permohonan:
                  type: string
                  enum: ["Pasang Baru (PB)", "Perubahan Daya (PD)"]
                jenis_sambungan:
                  type: string
                  enum: ["JTR", "JTM/Gardu", "PLG TM <5 GWNG", "PLG TM >5 GWNG"]
                ulp_unit:
                  type: string
                  nullable: true
                  description: Required only for PLG TM; forbidden for JTR/JTM
                pelanggan_nama: { type: string, minLength: 2, maxLength: 150 }
                pelanggan_alamat: { type: string, minLength: 2, maxLength: 255 }
                pelanggan_no_hp: { type: string, minLength: 8, maxLength: 20 }
      responses:
        "201":
          description: Permohonan created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PermohonanResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller role cannot create the selected connection type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /api/permohonan/{id}:
    get:
      tags: [Permohonan]
      summary: Get permohonan detail
      description: Returns all workflow nodes and every currently actionable node owned by the caller.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Permohonan detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PermohonanResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Permohonan not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /api/permohonan/{id}/activities:
    get:
      tags: [Permohonan]
      summary: Get the complete workflow-node timeline
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Canonically ordered workflow nodes with derived status and SLA state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/WorkflowNode" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Permohonan not found

  /api/permohonan/{id}/logs:
    get:
      tags: [Permohonan]
      summary: Get the aggregate audit history
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Activity logs ordered oldest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ActivityLog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Permohonan not found

  /api/permohonan/{id}/survei:
    post:
      tags: [Permohonan]
      summary: Complete survey (Activity #2)
      description: >-
        Owned by matching-ULP `teknik` for JTR/JTM and `perencanaan` for PLG TM.
        Attaches every document to the `survei` node and completes it atomically.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PermohonanID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SurveySubmitRequest" }
      responses:
        "200": { $ref: "#/components/responses/ActivitySubmitted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/permohonan/{id}/rab-kko-kkf:
    post:
      tags: [Permohonan]
      summary: Complete RAB/KKO/KKF and pole decision (Activity #3)
      description: >-
        Atomically completes `rab_kko_kkf` followed by `kebutuhan_tiang`.
        The RAB workbook remains evidence; this endpoint does not claim formula parity.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PermohonanID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RABSubmitRequest" }
      responses:
        "200": { $ref: "#/components/responses/ActivitySubmitted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/permohonan/{id}/permohonan-perluasan:
    post:
      tags: [Permohonan]
      summary: Complete expansion request and NPS delegation (Activities #4-#5)
      description: >-
        Owned by `nps`. Atomically completes `permohonan_perluasan` followed by
        `nps_delegation`. `delegated` unlocks applicable WO branches, while
        `returned` terminally closes the aggregate.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PermohonanID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpansionSubmitRequest" }
      responses:
        "200": { $ref: "#/components/responses/ActivitySubmitted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/permohonan/{id}/wo-vendor/tiang:
    post:
      tags: [Permohonan]
      summary: Complete pole-vendor work order (Activity #6)
      description: >-
        Owned by `perencanaan`; available only after NPS delegation when poles
        are required. The uploaded work-order artefact remains authoritative evidence.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PermohonanID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceSubmitRequest" }
      responses:
        "200": { $ref: "#/components/responses/ActivitySubmitted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/permohonan/{id}/wo-vendor/konstruksi:
    post:
      tags: [Permohonan]
      summary: Complete construction-vendor work order and PDKB decision (Activity #7)
      description: >-
        Owned by `konstruksi`. The required `perlu_pdkb` decision controls the
        conditional WO PDKB and documentation nodes. Explicit false is valid.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PermohonanID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WOConstructionSubmitRequest" }
      responses:
        "200": { $ref: "#/components/responses/ActivitySubmitted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/permohonan/{id}/wo-vendor/app:
    post:
      tags: [Permohonan]
      summary: Complete APP-vendor work order (Activity #8)
      description: >-
        Owned by `transaksi-energi`. Detailed production fields remain a discovery
        gate, so this contract requires evidence and accepts only optional notes.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PermohonanID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceSubmitRequest" }
      responses:
        "200": { $ref: "#/components/responses/ActivitySubmitted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/permohonan/{id}/reservasi-material:
    post:
      tags: [Permohonan]
      summary: Complete material reservation and APP assembly/tera (Activities #9-#10)
      description: >-
        Owned by `transaksi-energi`. Atomically completes `reservasi_material`
        followed by `tera_app` and classifies the evidence under both nodes.
        Relay/OCR field boundaries remain subject to business confirmation.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PermohonanID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservationTeraSubmitRequest" }
      responses:
        "200": { $ref: "#/components/responses/ActivitySubmitted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/permohonan/{id}/wo-pdkb:
    post:
      tags: [Permohonan]
      summary: Complete conditional PDKB work order
      description: >-
        Owned by `konstruksi`; available only after WO Konstruksi when
        `perlu_pdkb` is true. Completing it unlocks PK Vendor.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PermohonanID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceSubmitRequest" }
      responses:
        "200": { $ref: "#/components/responses/ActivitySubmitted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/permohonan/{id}/pk-vendor:
    post:
      tags: [Permohonan]
      summary: Complete vendor execution instruction
      description: >-
        Owned by `konstruksi`. Requires WO Konstruksi and, when applicable,
        WO PDKB to be completed before it unlocks construction execution.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PermohonanID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceSubmitRequest" }
      responses:
        "200": { $ref: "#/components/responses/ActivitySubmitted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/permohonan/{id}/pelaksanaan-konstruksi:
    post:
      tags: [Permohonan]
      summary: Complete pole installation or construction execution
      description: >-
        The request explicitly selects `pemasangan_tiang` (Activity #11,
        `vendor-tiang`) or `pelaksanaan_konstruksi` (Activity #12,
        `vendor-konstruksi`). Exact-node authorization prevents one vendor role
        from submitting the other node. Detailed production fields remain a
        discovery gate, so evidence is required and notes are optional.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PermohonanID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConstructionExecutionSubmitRequest" }
      responses:
        "200": { $ref: "#/components/responses/ActivitySubmitted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/permohonan/{id}/pdkb-dokumentasi:
    post:
      tags: [Permohonan]
      summary: Complete conditional PDKB documentation
      description: >-
        Owned by `pdkb`; available after construction only when PDKB is required.
        Evidence may contain the source photos/BAPL, but detailed production
        metadata remains subject to business confirmation.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PermohonanID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceSubmitRequest" }
      responses:
        "200": { $ref: "#/components/responses/ActivitySubmitted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/permohonan/{id}/energize-jaringan:
    post:
      tags: [Permohonan]
      summary: Complete network energization
      description: >-
        Activity #13. Owned by matching-ULP `teknik` for JTR/JTM and `jaringan`
        for PLG TM. Requires construction and every applicable pole/PDKB branch
        to be complete. Stores a structured operation result and requires
        document evidence for the operation BA.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PermohonanID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnergizeSubmitRequest" }
      responses:
        "200": { $ref: "#/components/responses/ActivitySubmitted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/permohonan/{id}/pemasangan-sr-app:
    post:
      tags: [Permohonan]
      summary: Complete SR/APP installation and energization
      description: >-
        Activity #14. Owned by `vendor-sr-app` for JTR/JTM and
        `vendor-konstruksi` for PLG TM. Requires construction and APP tera, but
        does not wait for the independent network-energize branch. Detailed
        production fields remain a discovery gate, so evidence is required and
        notes are optional.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PermohonanID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceSubmitRequest" }
      responses:
        "200": { $ref: "#/components/responses/ActivitySubmitted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/permohonan/{id}/closing:
    post:
      tags: [Permohonan]
      summary: Complete PDL, AIL/DIJ archive and close the request
      description: >-
        Requires both network energization and SR/APP installation to be complete.
        Only pelayanan-pelanggan in the request's target ULP may submit.
        Records the completed closing package in order: entri_mutasi_pdl,
        arsip_ail, then selesai. The supplied documents evidence all three nodes;
        notes are copied to each node. All state, evidence and audit changes are
        atomic. Returns status completed and empty available_actions. Resubmission
        or a returned request is rejected with 409. Detailed production fields and
        document-content verification remain subject to business confirmation.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PermohonanID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceSubmitRequest" }
      responses:
        "200": { $ref: "#/components/responses/ActivitySubmitted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/permohonan/{id}/vendor-assignments:
    post:
      tags: [Permohonan]
      summary: Assign a vendor account to a request
      description: >-
        Requires active NPS delegation. Perencanaan assigns vendor-tiang for an
        applicable pole branch, Konstruksi assigns vendor-konstruksi, and
        Transaksi Energi assigns vendor-sr-app for JTR/JTM. PLG TM uses
        vendor-konstruksi for SR/APP. The target account must have the requested
        role. One immutable assignment per request and vendor role; an existing
        slot returns 409. Assignment and its audit event commit atomically.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PermohonanID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendor_id, vendor_role]
              properties:
                vendor_id: { type: string, format: uuid }
                vendor_role:
                  type: string
                  enum: [vendor-tiang, vendor-konstruksi, vendor-sr-app]
      responses:
        "200": { $ref: "#/components/responses/ActivitySubmitted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ActivitySubmitted:
      description: Workflow node(s) completed and aggregate projection updated
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiResponse"
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/PermohonanResponse" }
    BadRequest:
      description: Request failed validation or business logic
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
    Unauthorized:
      description: Missing, invalid, or expired token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
    Forbidden:
      description: Caller does not own the workflow node or matching ULP scope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
    NotFound:
      description: Permohonan or evidence document not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
    Conflict:
      description: Node is not actionable or evidence is already attached/mismatched
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
  parameters:
    PermohonanID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    ApiResponse:
      type: object
      properties:
        status: { type: boolean }
        message: { type: string }
        error:
          nullable: true
          description: Present only when status is false
          oneOf:
            - type: string
            - type: object
        data:
          nullable: true
    PermohonanResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        no_permohonan: { type: string, example: "PBPD-2026-0001" }
        jenis_permohonan: { type: string }
        jenis_sambungan: { type: string }
        ulp_unit: { type: string }
        pelanggan_nama: { type: string }
        pelanggan_alamat: { type: string }
        pelanggan_no_hp: { type: string }
        request_date: { type: string, format: date }
        current_stage: { type: integer }
        status: { type: string }
        kebutuhan_tiang: { type: boolean, nullable: true }
        nps_delegation_status: { type: string, nullable: true, enum: [delegated, returned] }
        perlu_pdkb: { type: boolean, nullable: true }
        created_by: { type: string, format: uuid }
        workflow_nodes:
          type: array
          items: { $ref: "#/components/schemas/WorkflowNode" }
        available_actions:
          type: array
          items: { $ref: "#/components/schemas/AvailableAction" }
    WorkflowNode:
      type: object
      properties:
        workflow_node: { type: string, example: survei }
        activity_number: { type: integer, nullable: true }
        stage_number: { type: integer }
        status: { type: string, enum: [locked, available, in_progress, completed, skipped] }
        sla_deadline: { type: string, format: date, nullable: true }
        sla_status: { type: string, enum: [none, on_time, due_soon, overdue] }
