openapi: 3.0.3
info:
  title: COLABORA API — Permohonan
  description: >-
    Workflow-node API: connection-specific request creation, dashboard list,
    detail with caller-owned actions, full activity timeline and logs, plus
    Phase 4 Sequence 1 submissions through the NPS delegation decision.
  version: "1.0.0"
servers:
  - url: https://api-colabora.anargya.fun
    description: Production
  - url: http://localhost:8888
    description: Local (default GOLANG_PORT)
tags:
  - name: Permohonan
    description: Core permohonan aggregate — create, dashboard list, detail
paths:
  /api/permohonan:
    get:
      tags: [Permohonan]
      summary: Dashboard list of permohonan (paginated, filtered)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 10 }
        - name: search
          in: query
          description: Matches against no_permohonan or pelanggan_nama
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, default: created_at }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc] }
        - name: ulp
          in: query
          description: Filter by UlpUnit
          schema: { type: string }
        - name: jenis_sambungan
          in: query
          schema:
            type: string
            enum: ["JTR", "JTM/Gardu", "PLG TM <5 GWNG", "PLG TM >5 GWNG"]
        - name: stage
          in: query
          description: Filter by CurrentStage (1-7)
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string }
        - name: sla
          in: query
          description: Buckets by actionable workflow-node deadlines
          schema: { type: string, enum: [ontime, duesoon, overdue] }
        - name: scope
          in: query
          description: mine = rows with an available/in-progress node owned by the caller
          schema: { type: string, enum: [mine, all], default: all }
      responses:
        "200":
          description: Paginated permohonan list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedPermohonanResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Permohonan]
      summary: Open a new permohonan (Activity #1)
      description: >-
        For JTR/JTM, only `pelayanan-pelanggan` may call this and `ulp_unit`
        must be omitted because it is derived from the caller. For PLG TM,
        only `nps` may call this and a configured target `ulp_unit` is required.
        Submission completes the entry node and makes `survei` available.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jenis_permohonan, jenis_sambungan, pelanggan_nama, pelanggan_alamat, pelanggan_no_hp]
              properties:
                jenis_permohonan:
                  type: string
                  enum: ["Pasang Baru (PB)", "Perubahan Daya (PD)"]
                jenis_sambungan:
                  type: string
                  enum: ["JTR", "JTM/Gardu", "PLG TM <5 GWNG", "PLG TM >5 GWNG"]
                ulp_unit:
                  type: string
                  nullable: true
                  description: Required only for PLG TM; forbidden for JTR/JTM
                pelanggan_nama: { type: string, minLength: 2, maxLength: 150 }
                pelanggan_alamat: { type: string, minLength: 2, maxLength: 255 }
                pelanggan_no_hp: { type: string, minLength: 8, maxLength: 20 }
      responses:
        "201":
          description: Permohonan created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PermohonanResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller role cannot create the selected connection type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /api/permohonan/{id}:
    get:
      tags: [Permohonan]
      summary: Get permohonan detail
      description: Returns all workflow nodes and every currently actionable node owned by the caller.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Permohonan detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PermohonanResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Permohonan not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /api/permohonan/{id}/activities:
    get:
      tags: [Permohonan]
      summary: Get the complete workflow-node timeline
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Canonically ordered workflow nodes with derived status and SLA state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/WorkflowNode" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Permohonan not found

  /api/permohonan/{id}/logs:
    get:
      tags: [Permohonan]
      summary: Get the aggregate audit history
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Activity logs ordered oldest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ActivityLog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Permohonan not found

  /api/permohonan/{id}/survei:
    post:
      tags: [Permohonan]
      summary: Complete survey (Activity #2)
      description: >-
        Owned by matching-ULP `teknik` for JTR/JTM and `perencanaan` for PLG TM.
        Attaches every document to the `survei` node and completes it atomically.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PermohonanID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SurveySubmitRequest" }
      responses:
        "200": { $ref: "#/components/responses/ActivitySubmitted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/permohonan/{id}/rab-kko-kkf:
    post:
      tags: [Permohonan]
      summary: Complete RAB/KKO/KKF and pole decision (Activity #3)
      description: >-
        Atomically completes `rab_kko_kkf` followed by `kebutuhan_tiang`.
        The RAB workbook remains evidence; this endpoint does not claim formula parity.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PermohonanID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RABSubmitRequest" }
      responses:
        "200": { $ref: "#/components/responses/ActivitySubmitted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/permohonan/{id}/permohonan-perluasan:
    post:
      tags: [Permohonan]
      summary: Complete expansion request and NPS delegation (Activities #4-#5)
      description: >-
        Owned by `nps`. Atomically completes `permohonan_perluasan` followed by
        `nps_delegation`. `delegated` unlocks applicable WO branches, while
        `returned` terminally closes the aggregate.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PermohonanID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpansionSubmitRequest" }
      responses:
        "200": { $ref: "#/components/responses/ActivitySubmitted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ActivitySubmitted:
      description: Workflow node(s) completed and aggregate projection updated
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiResponse"
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/PermohonanResponse" }
    BadRequest:
      description: Request failed validation or business logic
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
    Unauthorized:
      description: Missing, invalid, or expired token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
    Forbidden:
      description: Caller does not own the workflow node or matching ULP scope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
    NotFound:
      description: Permohonan or evidence document not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
    Conflict:
      description: Node is not actionable or evidence is already attached/mismatched
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
  parameters:
    PermohonanID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    ApiResponse:
      type: object
      properties:
        status: { type: boolean }
        message: { type: string }
        error:
          nullable: true
          description: Present only when status is false
          oneOf:
            - type: string
            - type: object
        data:
          nullable: true
    PermohonanResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        no_permohonan: { type: string, example: "PBPD-2026-0001" }
        jenis_permohonan: { type: string }
        jenis_sambungan: { type: string }
        ulp_unit: { type: string }
        pelanggan_nama: { type: string }
        pelanggan_alamat: { type: string }
        pelanggan_no_hp: { type: string }
        request_date: { type: string, format: date }
        current_stage: { type: integer }
        status: { type: string }
        kebutuhan_tiang: { type: boolean, nullable: true }
        nps_delegation_status: { type: string, nullable: true, enum: [delegated, returned] }
        perlu_pdkb: { type: boolean, nullable: true }
        created_by: { type: string, format: uuid }
        workflow_nodes:
          type: array
          items: { $ref: "#/components/schemas/WorkflowNode" }
        available_actions:
          type: array
          items: { $ref: "#/components/schemas/AvailableAction" }
    WorkflowNode:
      type: object
      properties:
        workflow_node: { type: string, example: survei }
        activity_number: { type: integer, nullable: true }
        stage_number: { type: integer }
        status: { type: string, enum: [locked, available, in_progress, completed, skipped] }
        sla_deadline: { type: string, format: date, nullable: true }
        sla_status: { type: string, enum: [none, on_time, due_soon, overdue] }
        payload: { type: object, additionalProperties: true }
        completed_by: { type: string, format: uuid, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
    AvailableAction:
      type: object
      properties:
        workflow_node: { type: string }
        activity_number: { type: integer, nullable: true }
        stage_number: { type: integer }
        method: { type: string, example: POST }
        path: { type: string, example: "/api/permohonan/{id}/survei" }
    ActivityLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        workflow_node: { type: string, nullable: true }
        activity_number: { type: integer, nullable: true }
        actor: { type: string, format: uuid }
        action: { type: string }
        detail: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    SurveySubmitRequest:
      type: object
      required: [surveyed_at, document_ids]
      properties:
        surveyed_at: { type: string, format: date }
        notes: { type: string, maxLength: 2000 }
        document_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
    RABSubmitRequest:
      type: object
      required: [kebutuhan_tiang, document_ids]
      properties:
        kebutuhan_tiang:
          type: boolean
          description: Typed workflow decision; false is a valid explicit value.
        notes: { type: string, maxLength: 2000 }
        document_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
    ExpansionSubmitRequest:
      type: object
      required: [nps_delegation_status, document_ids]
      properties:
        nps_delegation_status: { type: string, enum: [delegated, returned] }
        notes: { type: string, maxLength: 2000 }
        document_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
    PaginationMeta:
      description: Shape produced by github.com/Caknoooo/go-pagination's PaginationResponse
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        max_page: { type: integer }
        total: { type: integer }
    PaginatedPermohonanResponse:
      description: Shape produced by github.com/Caknoooo/go-pagination's PaginatedResponse
      type: object
      properties:
        code: { type: integer }
        status: { type: string }
        message: { type: string }
        data:
          type: array
          items: { $ref: "#/components/schemas/PermohonanResponse" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }
