openapi: 3.0.3
info:
  title: COLABORA API — User
  description: User listing and self-service profile management. See `modules/user`.
  version: "1.0.0"
servers:
  - url: https://api-colabora.anargya.fun
    description: Production
  - url: http://localhost:8888
    description: Local (default GOLANG_PORT)
tags:
  - name: User
    description: User listing and self-service profile management
paths:
  /api/vendor:
    get:
      tags: [User]
      summary: List vendors for authenticated users
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          description: Optional vendor role filter
          schema:
            $ref: "#/components/schemas/VendorRole"
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 10, maximum: 100 }
        - name: search
          in: query
          description: Matches against vendor name
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, default: id }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        "200":
          description: Paginated vendor list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedVendorResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/user:
    get:
      tags: [User]
      summary: List accounts (admin or super-user only)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 10 }
        - name: search
          in: query
          description: Matches against name
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, default: id }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        "200":
          description: Paginated user list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedUserResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [User]
      summary: Create an operational account (admin or super-user only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountCreateRequest" }
            example:
              name: "CV Cahaya Listrik Sejahtera"
              email: "vendor.konstruksi@example.test"
              telp_number: "081234567890"
              password: "VendorDemo2026!"
              role: "vendor-konstruksi"
              unit: "CV Cahaya Listrik Sejahtera"
      responses:
        "200":
          description: Account created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/UserResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/user/me:
    get:
      tags: [User]
      summary: Get the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/UserResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/user/{id}:
    patch:
      tags: [User]
      summary: Update an account role, unit, or profile (admin or super-user only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountUpdateRequest" }
            example:
              name: "CV Cahaya Listrik Sejahtera"
              telp_number: "081234567891"
              role: "vendor-konstruksi"
              unit: "CV Cahaya Listrik Sejahtera"
      responses:
        "200":
          description: Account updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/UserUpdateResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [User]
      summary: Update the authenticated user's profile
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                name: "Budi Santoso"
                telp_number: "081234567890"
                email: "budi.santoso@example.test"
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                telp_number: { type: string, minLength: 8, maxLength: 20 }
                email: { type: string, format: email }
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/UserUpdateResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [User]
      summary: Delete the authenticated user's account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Request failed validation or business logic
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
    Unauthorized:
      description: Missing, invalid, or expired token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
    Forbidden:
      description: Authenticated caller lacks account-management access
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
  schemas:
    ApiResponse:
      type: object
      properties:
        status: { type: boolean }
        message: { type: string }
        error:
          nullable: true
          description: Present only when status is false
          oneOf:
            - type: string
            - type: object
        data:
          nullable: true
    UserResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        telp_number: { type: string }
        role: { type: string }
        unit: { type: string }
        image_url: { type: string }
        is_verified: { type: boolean }
    UserUpdateResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        telp_number: { type: string }
        role: { type: string }
        unit: { type: string }
        email: { type: string, format: email }
        is_verified: { type: boolean }
    AccountCreateRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email }
        telp_number: { type: string, minLength: 8, maxLength: 20 }
        password: { type: string, format: password, minLength: 8 }
        role: { $ref: "#/components/schemas/AccountRole" }
        unit: { type: string }
    AccountUpdateRequest:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email }
        telp_number: { type: string, minLength: 8, maxLength: 20 }
        role: { $ref: "#/components/schemas/AccountRole" }
        unit: { type: string }
    AccountRole:
      type: string
      enum: [admin, user, pelayanan-pelanggan, teknik, perencanaan, konstruksi, transaksi-energi, jaringan, nps, pdkb, vendor-tiang, vendor-konstruksi, vendor-sr-app, super-user]
    VendorRole:
      type: string
      enum: [vendor-tiang, vendor-konstruksi, vendor-sr-app]
      example: vendor-konstruksi
    VendorResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        telp_number: { type: string }
        role: { $ref: "#/components/schemas/VendorRole" }
        unit: { type: string }
    PaginationMeta:
      description: Shape produced by github.com/Caknoooo/go-pagination's PaginationResponse
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        max_page: { type: integer }
        total: { type: integer }
    PaginatedUserResponse:
      description: Shape produced by github.com/Caknoooo/go-pagination's PaginatedResponse
      type: object
      properties:
        code: { type: integer }
        status: { type: string }
        message: { type: string }
        data:
          type: array
          items: { $ref: "#/components/schemas/UserResponse" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }
    PaginatedVendorResponse:
      description: Shape produced by github.com/Caknoooo/go-pagination's PaginatedResponse
      type: object
      properties:
        code: { type: integer }
        status: { type: string }
        message: { type: string }
        data:
          type: array
          items: { $ref: "#/components/schemas/VendorResponse" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }
