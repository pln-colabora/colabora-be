<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>COLABORA Architecture Diagrams</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f7fb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.5rem;
      background: #fff;
      border-bottom: 1px solid #dbe3ef;
    }
    header h1 { margin: 0; font-size: 1.1rem; color: #123867; }
    header a { color: #1769aa; font-size: .875rem; text-decoration: none; }
    .layout {
      display: grid;
      grid-template-columns: minmax(230px, 280px) minmax(0, 1fr);
      min-height: calc(100vh - 62px);
    }
    nav {
      padding: 1rem;
      background: #fff;
      border-right: 1px solid #dbe3ef;
    }
    nav p { margin: 0 0 .75rem; color: #64748b; font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; }
    nav button {
      display: block;
      width: 100%;
      margin: 0 0 .35rem;
      padding: .7rem .8rem;
      border: 0;
      border-radius: .55rem;
      background: transparent;
      color: #334155;
      cursor: pointer;
      text-align: left;
      font: inherit;
      font-size: .875rem;
    }
    nav button:hover { background: #eff6ff; }
    nav button.active { background: #dbeafe; color: #174f86; font-weight: 700; }
    main { min-width: 0; padding: 1.5rem; }
    .card {
      min-height: 70vh;
      padding: 1.25rem;
      overflow: auto;
      background: #fff;
      border: 1px solid #dbe3ef;
      border-radius: .8rem;
      box-shadow: 0 10px 25px rgb(15 23 42 / 5%);
    }
    .meta { display: flex; justify-content: space-between; gap: 1rem; align-items: start; margin-bottom: 1rem; }
    .meta h2 { margin: 0 0 .35rem; color: #123867; }
    .meta p { margin: 0; color: #64748b; font-size: .9rem; }
    .badge { white-space: nowrap; border-radius: 999px; padding: .3rem .65rem; background: #dcfce7; color: #166534; font-size: .75rem; font-weight: 700; }
    #diagram { min-width: 760px; padding: 1rem 0; text-align: center; }
    #diagram svg { margin: 0 auto; }
    #error { display: none; padding: 1rem; border-radius: .5rem; background: #fee2e2; color: #991b1b; white-space: pre-wrap; }
    footer { margin-top: 1rem; color: #64748b; font-size: .8rem; }
    footer a { color: #1769aa; }
    @media (max-width: 800px) {
      header { align-items: flex-start; }
      .layout { grid-template-columns: 1fr; }
      nav { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid #dbe3ef; }
      nav p { display: none; }
      nav button { flex: 0 0 190px; margin: 0 .35rem 0 0; }
      main { padding: .75rem; }
      .meta { display: block; }
      .badge { display: inline-block; margin-top: .75rem; }
    }
  </style>
  <script
    src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"
    integrity="sha384-WmdflGW9aGfoBdHc4rRyWzYuAjEmDwMdGdiPNacbwfGKxBW/SO6guzuQ76qjnSlr"
    crossorigin="anonymous"
  ></script>
</head>
<body>
  <header>
    <h1>COLABORA Architecture Diagrams</h1>
    <a href="/docs">API Reference &rarr;</a>
  </header>
  <div class="layout">
    <nav id="navigation"><p>Diagram</p></nav>
    <main>
      <section class="card">
        <div class="meta">
          <div><h2 id="title"></h2><p id="description"></p></div>
          <span class="badge">Implemented state</span>
        </div>
        <div id="error" role="alert"></div>
        <pre id="diagram" class="mermaid" aria-label="Architecture diagram"></pre>
        <footer>
          Sumber Mermaid: <a id="source-link" href="#">Markdown</a> · Diverifikasi 9 September 2026
        </footer>
      </section>
    </main>
  </div>
  <script>
    const diagrams = [
      ["workflow-jtr-jtm", "Workflow JTR/JTM", "21 node, cabang paralel, keputusan, join, dan ownership JTR/JTM", "01-workflow-jtr-jtm.md"],
      ["workflow-plg-tm", "Workflow PLG TM", "21 node dengan ownership khusus PLG TM", "02-workflow-plg-tm.md"],
      ["workflow-state", "Workflow State", "Lifecycle node dan aggregate permohonan", "03-workflow-state.md"],
      ["rbac", "RBAC Ownership", "Write ownership dan read scope", "04-rbac-ownership.md"],
      ["activity-submission", "Activity Submission", "Transaksi atomik, evidence, audit, dan rollback", "05-activity-submission.md"],
      ["data-model", "Data Model", "Relasi entity yang dipersistensikan", "06-data-model.md"],
      ["components", "Components", "Batas modul dan layanan infrastruktur", "07-components.md"],
      ["api-actions", "API Action Map", "Endpoint write, node, owner, evidence, dan hasil", "08-api-action-map.md"],
      ["evidence", "Evidence Lifecycle", "Upload, scan, revision, attachment, dan cleanup", "09-evidence-lifecycle.md"],
      ["sla", "SLA & Critical Path", "Dependency utama dan SLA independen", "10-sla-critical-path.md"]
    ];

    mermaid.initialize({ startOnLoad: false, theme: "base", securityLevel: "strict", flowchart: { curve: "basis", htmlLabels: true } });

    const navigation = document.getElementById("navigation");
    const diagram = document.getElementById("diagram");
    const errorBox = document.getElementById("error");

    for (const item of diagrams) {
      const button = document.createElement("button");
      button.type = "button";
      button.dataset.id = item[0];
      button.textContent = item[1];
      button.addEventListener("click", () => selectDiagram(item[0]));
      navigation.appendChild(button);
    }

    async function selectDiagram(id) {
      const selected = diagrams.find((item) => item[0] === id) || diagrams[0];
      history.replaceState(null, "", `#${selected[0]}`);
      document.getElementById("title").textContent = selected[1];
      document.getElementById("description").textContent = selected[2];
      document.getElementById("source-link").href = `/docs/architecture/diagrams/${selected[3]}`;
      document.querySelectorAll("nav button").forEach((button) => button.classList.toggle("active", button.dataset.id === selected[0]));
      errorBox.style.display = "none";
      diagram.style.display = "block";

      try {
        const response = await fetch(`/docs/architecture/diagrams/${selected[3]}`, { credentials: "same-origin" });
        if (!response.ok) throw new Error(`Gagal memuat diagram (${response.status})`);
        const markdown = await response.text();
        const match = markdown.match(/```mermaid\s*([\s\S]*?)```/);
        if (!match) throw new Error("Blok Mermaid tidak ditemukan pada sumber diagram.");
        diagram.removeAttribute("data-processed");
        diagram.textContent = match[1].trim();
        await mermaid.run({ nodes: [diagram] });
      } catch (error) {
        diagram.style.display = "none";
        errorBox.textContent = `Diagram tidak dapat ditampilkan.\n${error.message}`;
        errorBox.style.display = "block";
      }
    }

    selectDiagram(location.hash.slice(1));
  </script>
</body>
</html>
